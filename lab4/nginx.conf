events {
    worker_connections 1024;
}

http {
    upstream bookshelf_api {
        # least_conn sends each new request to the replica with fewest
        # active connections, giving better distribution than round-robin
        # when requests vary in processing time.
        least_conn;
        server api:5000;
    }

    server {
        listen 80;

        # Increase timeout for long-running requests (ISBN lookup, cover upload)
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;

        # Pass real client IP to the backend for logging
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location / {
            proxy_pass http://bookshelf_api;
        }
    }
}
